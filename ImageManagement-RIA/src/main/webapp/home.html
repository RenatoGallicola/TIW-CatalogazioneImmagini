<!DOCTYPE html>
<html>

<head>
	<meta charset="ISO-8859-1">
	<title>Home - Image Management</title>
	<link rel="stylesheet" href="../css/home.css"/>
	<link rel="icon" type="image/x-icon" href="/ImageManagement-PureHTML/images/favicon.ico">
</head>

<body>
	
	<div class="userInfo">
		
		<label id="username"></label>
		<a href="CheckLogout">
			<img src="/ImageManagement-PureHTML/images/user.png"/>
			<div class="logout">LOGOUT</div>			
		</a>
		
	</div>
	
	<div class="pageContent">
		
		<div class="categoryForm">
		
			<p>Complete the form to create a new category</p>
			
			<form action="#" id="createCategory">
			
				<div id="error_div">
					<!--
					<label class="error_symbol">&#x26A0</label>
					<span></span>
					<label class="error_label" th:text="${error_message}"></label>
					 -->
				</div>
				
				<div id="nameField" class="nameField">
					<input type="text" name="nameForm" id="nameForm" required/>
					<label>Name</label>
				</div>
				
				<div id="categoryField" class="categoryField">
					<select name="categoryIdForm" id="categoryIdForm" required>
						<option value="" disabled selected>Choose the parent category</option>
						<option value="0">0 - Root</option>
						<!-- <option></option>  -->
					</select>
				</div>
				
				<input id="submitForm" type="submit" value="CREATE">
			
			</form>
		</div>
		
		<div class="treeDiv">
			<ul id="categoryTree" class="categoryTree">
				
				<!-- <li></li>  -->
				
				<!-- <li><div class="treeFooter"></div></li> -->
				
			</ul>
		</div>
	</div>
	
</body>
</html>
