<!DOCTYPE html>
<html>

<head>
	<meta charset="ISO-8859-1">
	<title>Home - Image Management</title>
	<link rel="stylesheet" href="css/home.css"/>
	<link rel="icon" type="image/x-icon" href="/ImageManagement-RIA/images/favicon.ico">
	<script src="javascript/utils.js" charset="utf-8" defer></script>
	<script src="javascript/homePageManagement.js" charset="utf-8" defer></script>
	
</head>

<body>
	
	<div class="userInfo">
		
		<label id="username"></label>
		<a id="logout">
			<img src="/ImageManagement-RIA/images/user.png"/>
			<div class="logout">LOGOUT</div>			
		</a>
		
	</div>
	
	<div class="pageContent">
		
		<div class="categoryForm">
		
			<p>Complete the form to create a new category</p>
			
			<form action="#" id="createCategory">
			
				<div id="error_div"> </div>
				
				<div id="nameField" class="nameField">
					<input type="text" name="name" id="nameForm" required/>
					<label>Name</label>
				</div>
				
				<div id="categoryField" class="categoryField">
					<select name="categoryId" id="categoryIdForm" required>
						<option value="" disabled selected>Choose the parent category</option>
						<option value="0">0 - Root</option>
					</select>
				</div>
				
				<input id="submitForm" type="submit" value="CREATE">
			
			</form>
		</div>
		
		<div id="treeDivObj">
		
		</div>
	</div>
	
</body>
</html>
